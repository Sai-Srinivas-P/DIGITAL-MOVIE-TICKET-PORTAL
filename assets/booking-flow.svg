<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><rect width="1100" height="470" rx="24" fill="#0a0d16"/><text x="48" y="54" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Booking flow</text><text x="48" y="82" fill="#aeb4c2" font-family="Arial" font-size="13">The current application flow from movie selection to seat reservation.</text><g font-family="Arial"><g><rect x="48" y="130" width="200" height="100" rx="16" fill="#131827" stroke="#3d3448"/><text x="70" y="160" fill="#ffb000" font-weight="700">1 · DISCOVER</text><text x="70" y="185" fill="#fff">Fetch active movies</text><text x="70" y="208" fill="#aeb4c2">GET /getactivemovies</text></g><g><rect x="300" y="130" width="200" height="100" rx="16" fill="#131827" stroke="#3d3448"/><text x="322" y="160" fill="#ff375f" font-weight="700">2 · FILTER</text><text x="322" y="185" fill="#fff">Choose date + theatre</text><text x="322" y="208" fill="#aeb4c2">POST /gettheatres</text></g><g><rect x="552" y="130" width="200" height="100" rx="16" fill="#131827" stroke="#3d3448"/><text x="574" y="160" fill="#ffb000" font-weight="700">3 · SHOWTIME</text><text x="574" y="185" fill="#fff">Pick a running show</text><text x="574" y="208" fill="#aeb4c2">POST /fetchtheatresbymovieanddate</text></g><g><rect x="804" y="130" width="248" height="100" rx="16" fill="#131827" stroke="#3d3448"/><text x="826" y="160" fill="#ff375f" font-weight="700">4 · SEATS</text><text x="826" y="185" fill="#fff">Load + select seats</text><text x="826" y="208" fill="#aeb4c2">POST /fetchseatdtls</text></g><path d="M248 180H300M500 180H552M752 180H804" stroke="#ff375f" stroke-width="4"/><rect x="160" y="290" width="780" height="112" rx="20" fill="#0f1421" stroke="#3d3448"/><text x="190" y="324" fill="#fff" font-family="Arial" font-size="15" font-weight="700">5 · RESERVE</text><text x="190" y="350" fill="#aeb4c2" font-family="Arial" font-size="13">POST /savedetails → check show status → verify every requested seat → mark selected seats as booked.</text><text x="190" y="374" fill="#aeb4c2" font-family="Arial" font-size="13">The UI maps: white = available • grey = already booked • red = locally selected.</text></g></svg>