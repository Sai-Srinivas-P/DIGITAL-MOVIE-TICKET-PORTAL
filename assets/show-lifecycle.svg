<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" rx="24" fill="#0a0d16"/><text x="46" y="50" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Automated show lifecycle</text><text x="46" y="77" fill="#aeb4c2" font-family="Arial" font-size="13">SchedulerSrvc runs every 60 seconds and updates show state.</text><g font-family="Arial"><rect x="70" y="125" width="220" height="90" rx="16" fill="#131827" stroke="#3d3448"/><text x="96" y="158" fill="#ffb000" font-size="14" font-weight="700">UPCOMING · Y</text><text x="96" y="184" fill="#fff" font-size="13">Eligible for booking</text><path d="M290 170H390" stroke="#ff375f" stroke-width="4"/><circle cx="340" cy="170" r="7" fill="#ff375f"><animate attributeName="r" values="7;14;7" dur="1.5s" repeatCount="indefinite"/></circle><rect x="390" y="125" width="220" height="90" rx="16" fill="#131827" stroke="#3d3448"/><text x="416" y="158" fill="#ff375f" font-size="14" font-weight="700">RUNNING · R</text><text x="416" y="184" fill="#fff" font-size="13">Booking closes</text><path d="M610 170H710" stroke="#ff375f" stroke-width="4"/><circle cx="660" cy="170" r="7" fill="#ff375f"><animate attributeName="r" values="7;14;7" dur="1.5s" begin=".5s" repeatCount="indefinite"/></circle><rect x="710" y="125" width="220" height="90" rx="16" fill="#131827" stroke="#3d3448"/><text x="736" y="158" fill="#8d94a3" font-size="14" font-weight="700">COMPLETED · C</text><text x="736" y="184" fill="#fff" font-size="13">Historical / closed</text><rect x="130" y="255" width="740" height="48" rx="12" fill="#0f1421"/><text x="155" y="285" fill="#aeb4c2" font-family="Arial" font-size="13">Daily refresh also creates the current day's Movie1–Movie4 × Theatre1–Theatre4 × four show-time schedule.</text></g></svg>